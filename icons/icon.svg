<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: rounded square with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6cff"/>
      <stop offset="100%" style="stop-color:#4de3c1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Pixel grid pattern (subtle) -->
  <g opacity="0.08">
    <rect x="0" y="128" width="512" height="2" fill="#fff"/>
    <rect x="0" y="256" width="512" height="2" fill="#fff"/>
    <rect x="0" y="384" width="512" height="2" fill="#fff"/>
    <rect x="128" y="0" width="2" height="512" fill="#fff"/>
    <rect x="256" y="0" width="2" height="512" fill="#fff"/>
    <rect x="384" y="0" width="2" height="512" fill="#fff"/>
  </g>
  
  <!-- Pixel-art "6" character -->
  <g fill="#0f1221">
    <!-- Main body of 6 in pixel blocks (32px grid) -->
    <rect x="160" y="96" width="32" height="32"/>
    <rect x="192" y="96" width="32" height="32"/>
    <rect x="224" y="96" width="32" height="32"/>
    <rect x="256" y="96" width="32" height="32"/>
    <rect x="128" y="128" width="32" height="32"/>
    <rect x="160" y="128" width="32" height="32"/>
    <rect x="128" y="160" width="32" height="32"/>
    <rect x="128" y="192" width="32" height="32"/>
    <rect x="128" y="224" width="32" height="32"/>
    <rect x="160" y="224" width="32" height="32"/>
    <rect x="192" y="224" width="32" height="32"/>
    <rect x="224" y="224" width="32" height="32"/>
    <rect x="128" y="256" width="32" height="32"/>
    <rect x="256" y="256" width="32" height="32"/>
    <rect x="288" y="256" width="32" height="32"/>
    <rect x="128" y="288" width="32" height="32"/>
    <rect x="288" y="288" width="32" height="32"/>
    <rect x="160" y="320" width="32" height="32"/>
    <rect x="192" y="320" width="32" height="32"/>
    <rect x="224" y="320" width="32" height="32"/>
    <rect x="256" y="320" width="32" height="32"/>
  </g>
  
  <!-- Pixel-art book/card icon bottom right -->
  <g fill="#fff" opacity="0.9">
    <rect x="320" y="352" width="96" height="8"/>
    <rect x="320" y="368" width="96" height="8"/>
    <rect x="320" y="384" width="64" height="8"/>
    <rect x="312" y="344" width="8" height="56"/>
    <rect x="416" y="344" width="8" height="56"/>
    <rect x="312" y="400" width="112" height="8"/>
  </g>
  
  <!-- "CET" text pixel style top area -->
  <g fill="#fff" opacity="0.85">
    <text x="310" y="200" font-family="monospace" font-size="72" font-weight="900" letter-spacing="-2">CET</text>
  </g>
</svg>
